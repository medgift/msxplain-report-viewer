  orthanc:
    image: jodogne/orthanc-plugins:1.12.9
    container_name: msxplain_orthancPACS
    hostname: orthanc
    volumes:
      # Config
      - ./config_ohif_orthnac/config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./config_ohif_orthnac/volumes/orthanc-db/:/var/lib/orthanc/db/
    ports:
      - '4242:4242' # Orthanc REST API
      - '8042:8042' # Orthanc HTTP
    restart: unless-stopped
    networks:
      - msxplain-network

networks:
  msxplain-network:
    driver: bridge

