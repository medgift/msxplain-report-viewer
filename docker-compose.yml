# Docker compose file for MSXplain application

services:
  msxplain_backend:
    build: ./backend
    container_name: msxplain_backend
    volumes:
      # Persist data
      - ./backend/files:/app/files
    ports:
      - "5000:5000"
    # depends_on:
    #   - db
    restart: unless-stopped
    networks:
      - msxplain-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

