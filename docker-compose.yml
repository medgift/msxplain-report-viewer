version: '3.8'

services:
  # Your Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_backend_prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/medical_db
      - ORTHANC_URL=http://orthanc:8042
      - REDIS_URL=redis://redis:6379
      - ENV=production
    volumes:
      - backend_data:/app/data
    depends_on:
      - db
      - redis
      - orthanc
    networks:
      - medical_network
    restart: unless-stopped

  # Your Frontend Service (Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical_frontend_prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medical_network
    restart: unless-stopped

  # Database
  db:
    image: postgres:15-alpine
    container_name: medical_db_prod
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=medical_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medical_network
    restart: unless-stopped

  # Redis (for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: medical_redis_prod
    volumes:
      - redis_data:/data
    networks:
      - medical_network
    restart: unless-stopped

  # Orthanc DICOM Server
  orthanc:
    image: jodogne/orthanc-plugins:1.12.1
    container_name: medical_orthanc_prod
    ports:
      - "4242:4242"  # DICOM port
      - "8042:8042"  # Web interface
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    networks:
      - medical_network
    restart: unless-stopped

  # OHIF Viewer
  ohif:
    image: ohif/app:v3.7.0
    container_name: medical_ohif_prod
    ports:
      - "3001:80"
    environment:
      - APP_CONFIG=/usr/share/nginx/html/app-config.js
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc
    networks:
      - medical_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: medical_proxy_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - ohif
    networks:
      - medical_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  orthanc_data:
  backend_data:

networks:
  medical_network:
    driver: bridge
