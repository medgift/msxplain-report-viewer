version: '3.8'

services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msxplain-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/files:/app/files
      - ./backend/config.yml:/app/config.yml:ro
      # Mount FreeSurfer license if you have one
      # - ./freesurfer_license.txt:/opt/freesurfer/license.txt:ro
    environment:
      - PYTHONPATH=/app
      - ORTHANC_URL=http://orthanc:8042
      - FSLDIR=/usr/share/fsl/6.0
      - FSLOUTPUTTYPE=NIFTI_GZ
      - FREESURFER_HOME=/usr/local/freesurfer
      - ANTSPATH=/opt/ants
    networks:
      - msxplain-network
    depends_on:
      - orthanc
    restart: unless-stopped
    # Uncomment the following lines if you have a GPU and want to use it
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msxplain-frontend
    ports:
      - "3001:80"
    networks:
      - msxplain-network
    depends_on:
      - backend
    restart: unless-stopped

  # Orthanc PACS server
  orthanc:
    container_name: orthanc
    image: jodogne/orthanc-plugins:1.12.6
    ports:
      - "8042:8042"
      - "4242:4242"
    volumes:
      - ./ohif-orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./ohif-orthanc/orthanc_db:/var/lib/orthanc/db
    networks:
      - msxplain-network
    restart: unless-stopped

  # OHIF Viewer
  ohif_viewer:
    container_name: ohif
    image: ohif-viewer
    ports:
      - "3000:80"
    volumes:
      - ./ohif-orthanc/app-config.js:/usr/share/nginx/html/app-config.js:ro
    networks:
      - msxplain-network
    depends_on:
      - orthanc
    restart: unless-stopped

networks:
  msxplain-network:
    driver: bridge

volumes:
  orthanc_db:
  processed_files:
