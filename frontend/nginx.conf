# Preserve the scheme reported by an upstream TLS terminator (Traefik sets
# X-Forwarded-Proto: https and forwards to this nginx over http). Without this,
# `$scheme` would always be "http" at this hop, so the backend would never set
# `Secure` on the `dcmw` viewer cookie (a raw JWT) behind TLS. Fall back to this
# hop's own scheme when there is no upstream header (direct dev over http).
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name localhost;

    # Allow large file uploads for DICOM files
    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy Supabase auth (GoTrue) so the browser can reach it same-origin.
    # The trailing slashes strip the /auth/v1/ prefix (…/auth/v1/token -> /token).
    location /auth/v1/ {
        proxy_pass http://supabase-auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Proxy API requests to backend. CORS is owned entirely by FastAPI (single
    # source of truth); nginx no longer injects any Access-Control headers.
    location /api/ {
        # Allow large uploads for DICOM files
        client_max_body_size 500M;

        proxy_pass http://msxplain_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        # Stream backend responses (large WADO-RS DICOM payloads) instead of
        # buffering them to disk/memory first.
        proxy_buffering off;

        # Increase timeouts for large file uploads
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OHIF viewer (internal container), served SAME-ORIGIN so viewer requests
    # to /api/dicom-web carry the `dcmw` session cookie automatically. OHIF
    # fetches images only from that backend proxy, never from Orthanc directly.
    # NOTE: if OHIF's static assets 404 under this subpath, the OHIF image must
    # be built/served with PUBLIC_URL=/viewer/ (its bundle uses absolute paths).
    location /viewer/ {
        proxy_pass http://ohif:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
